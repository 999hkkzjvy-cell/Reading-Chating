<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7d2638">
  <title>暂时离线 · 以读攻独</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fbf9f6; color: #2d2422; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #fffaf4 0, #fbf9f6 58%); }
    main { width: min(100%, 380px); padding: 28px 24px; border: 1px solid #e7ded5; border-radius: 20px; background: rgba(255, 253, 250, .94); box-shadow: 0 16px 40px rgba(45, 36, 34, .08); text-align: center; }
    .mark { width: 58px; height: 58px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 18px; background: #f2e3d6; color: #7d2638; font-size: 28px; }
    h1 { margin: 0 0 10px; font: 700 1.45rem/1.35 Georgia, "Noto Serif SC", serif; }
    p { margin: 0 0 22px; color: #766a62; font-size: .94rem; line-height: 1.8; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 10px; background: #7d2638; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">📖</div>
    <h1>暂时没有网络</h1>
    <p>当前只保留了离线提示页。恢复网络后，可以重新打开以读攻独，未提交的内容不会被离线缓存覆盖。</p>
    <a href="/">重新连接</a>
  </main>
</body>
</html>
